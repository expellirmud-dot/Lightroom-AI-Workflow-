name: Lightroom AI Workflow Certification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project with all extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: WO-029 focused prepared-job tests
        run: |
          python -m pytest -q tests/test_job_lifecycle.py tests/test_saved_job_cli.py tests/test_apply_saved_folder.py tests/test_lightroom_plugin.py

      - name: Run full pytest suite
        run: |
          python -m pytest -q tests/

      - name: CLI config smoke test
        run: |
          lr-ai-exposure --check-config

      - name: Integration suite
        run: |
          python -m pytest -q tests/integration/

      - name: Compile source and tests
        run: |
          python -m compileall -q src
          python -m compileall -q tests

      - name: Diff check
        run: |
          git diff --check

      - name: Verify clean working tree (no private artifacts)
        run: |
          git status --short
