[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lr-ai-exposure"
version = "0.1.0"
description = "Lightroom Classic exposure assistant — MVP scaffold"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=2.14.0",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
all-extras = ["pytest>=7.0"]

[project.scripts]
lr-ai-exposure = "lr_ai_exposure.main:main"

[tool.pytest.ini_options]
testpaths = ["tests", "tests/integration"]
addopts = "-q"
pythonpath = ["."]
